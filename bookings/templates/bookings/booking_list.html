{% extends "base.html" %}
{% block content %}
<h1>Активные бронирования</h1>
{% for b in bookings %}
    <div class="card mb-2">
        <div class="card-body">
            <h5>{{ b.instrument_name }}</h5>
            <p>Дата: {{ b.booking_date }}</p>
            <p>Пользователь: {{ b.user_name }}</p>
            <a href="{% url 'bookings:booking_detail' b.id %}" class="btn btn-sm btn-outline-primary">Подробнее</a>
        </div>
    </div>
{% empty %}
    <p>Активных бронирований нет.</p>
{% endfor %}
{% endblock %}
